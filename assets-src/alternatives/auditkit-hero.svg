  <line x1="140" y1="208" x2="140" y2="538" stroke="#c6bda1" stroke-width="1" /><line x1="140" y1="538" x2="920" y2="538" stroke="#c6bda1" stroke-width="1" /><text x="680" y="562" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#5d685f" letter-spacing="1.6" text-anchor="start" xml:space="preserve">CLASSIC APPLICATION AUDIT -&gt;</text><text x="122" y="218" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#5d685f" letter-spacing="1.6" transform="rotate(-90 122 218)" text-anchor="end">AI-AGENT PROVENANCE -&gt;</text><rect x="640" y="432" width="250" height="86" fill="#fbf9f2" stroke="#c6bda1" stroke-width="1" /><text x="656" y="456" font-family="IBM Plex Mono" font-size="11.5" font-weight="600" fill="#1a231e" letter-spacing="0" text-anchor="start" xml:space="preserve">AuditKit (auditkit.dev)</text><text x="656" y="474" font-family="IBM Plex Mono" font-size="10" font-weight="400" fill="#5d685f" letter-spacing="0" text-anchor="start" xml:space="preserve">SHA-256 chain · Merkle proofs</text><text x="656" y="490" font-family="IBM Plex Mono" font-size="10" font-weight="400" fill="#5d685f" letter-spacing="0" text-anchor="start" xml:space="preserve">AGPLv3 core · paid tiers</text><text x="656" y="506" font-family="IBM Plex Mono" font-size="10" font-weight="400" fill="#5d685f" letter-spacing="0" text-anchor="start" xml:space="preserve">first released June 2026</text><rect x="480" y="224" width="410" height="150" fill="#fbf9f2" stroke="#2f6f57" stroke-width="1.4" /><text x="496" y="250" font-family="IBM Plex Mono" font-size="12.5" font-weight="600" fill="#235943" letter-spacing="0" text-anchor="start" xml:space="preserve">Veritio</text><text x="496" y="270" font-family="IBM Plex Mono" font-size="10" font-weight="400" fill="#414c44" letter-spacing="0" text-anchor="start" xml:space="preserve">hash chain + signed vevb-1 bundles · offline verifier</text><text x="496" y="288" font-family="IBM Plex Mono" font-size="10" font-weight="400" fill="#41